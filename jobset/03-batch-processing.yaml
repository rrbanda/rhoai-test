# JobSet Test Case 3: Parallel Batch Processing (HPC pattern, non-AI)
#
# Validates: JobSet for a non-AI HPC-style parallel batch workload.
#            Proves JobSet is NOT GPU-specific.
# Image:     registry.access.redhat.com/ubi9/ubi-minimal:9.6 (no auth required)
# Expected:  6 pods (3 replicas × 2 completions), all complete.
#
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jobset-batch-cpu
spec:
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - batch-processors
  replicatedJobs:
  - name: batch-processors
    replicas: 3
    template:
      spec:
        backoffLimit: 1
        completions: 2
        parallelism: 2
        template:
          spec:
            containers:
            - name: processor
              image: registry.access.redhat.com/ubi9/ubi-minimal:9.6
              command:
              - /bin/sh
              - -c
              - |
                echo "=== Batch Processor ==="
                echo "Host: $HOSTNAME"
                echo ""
                echo "Simulating CPU-bound batch processing..."
                for i in $(seq 1 100); do
                  echo "batch-item-$HOSTNAME-$i" | md5sum > /dev/null
                done
                echo "Processed 100 items successfully"
                echo "Completed at $(date)"
              resources:
                requests:
                  cpu: "100m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "128Mi"
            restartPolicy: Never
