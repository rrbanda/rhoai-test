# JobSet Test Case 2: Distributed PyTorch Training on CPU (Gloo Backend)
#
# Validates: JobSet orchestrates a real distributed PyTorch DDP training
#            workload across 2 pods on CPU-only nodes using the Gloo backend.
# Image:     registry.redhat.io/rhoai/odh-th06-cpu-torch210-py312-rhel9
#            (Red Hat's CPU-only Training Hub image — requires RHOAI entitlement)
# Expected:  2 pods train a simple MLP for 3 epochs, synchronize via barrier, complete.
#
# VERIFIED:  OCP 4.20.33, JobSet 1.0.1, 2026-10-22
#   Rank 0: PyTorch 2.10.0, CUDA available: False, Epoch 1/3 avg loss: 2.3188
#   Rank 1: PyTorch 2.10.0, CUDA available: False, [Gloo] connected to 1 peer
#   Both ranks: "Training COMPLETE - all ranks synchronized"
#
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jobset-pytorch-cpu
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - workers
  replicatedJobs:
  - name: workers
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completions: 2
        parallelism: 2
        template:
          spec:
            containers:
            - name: pytorch
              image: registry.redhat.io/rhoai/odh-th06-cpu-torch210-py312-rhel9@sha256:4b762d722faa80d7c6641a631d891f0ddf048950a4f8b6e5b93010d65134687d
              ports:
              - containerPort: 29500
                protocol: TCP
              env:
              - name: MASTER_ADDR
                value: "jobset-pytorch-cpu-workers-0-0.jobset-pytorch-cpu"
              - name: MASTER_PORT
                value: "29500"
              - name: WORLD_SIZE
                value: "2"
              command:
              - python3
              - -c
              - |
                import os, socket, torch, torch.distributed as dist
                import torch.nn as nn, torch.optim as optim
                from torch.nn.parallel import DistributedDataParallel as DDP

                hostname = socket.gethostname()
                rank = int(hostname.rsplit("-", 1)[-1])
                os.environ["RANK"] = str(rank)
                world_size = int(os.environ["WORLD_SIZE"])
                master = os.environ["MASTER_ADDR"]
                port = os.environ["MASTER_PORT"]

                print(f"=== Distributed PyTorch CPU Training ===")
                print(f"Hostname: {hostname}")
                print(f"Rank: {rank}, World Size: {world_size}")
                print(f"Master: {master}:{port}")
                print(f"PyTorch: {torch.__version__}")
                print(f"CUDA available: {torch.cuda.is_available()}")

                print(f"[Rank {rank}] Initializing gloo backend...")
                dist.init_process_group(
                    backend="gloo",
                    init_method=f"tcp://{master}:{port}",
                    rank=rank, world_size=world_size
                )
                print(f"[Rank {rank}] Process group initialized!")

                model = DDP(nn.Sequential(nn.Linear(784, 256), nn.ReLU(), nn.Linear(256, 10)))
                optimizer = optim.SGD(model.parameters(), lr=0.01)
                criterion = nn.CrossEntropyLoss()

                for epoch in range(3):
                    epoch_loss = 0.0
                    for batch in range(10):
                        data = torch.randn(32, 784)
                        target = torch.randint(0, 10, (32,))
                        optimizer.zero_grad()
                        output = model(data)
                        loss = criterion(output, target)
                        loss.backward()
                        optimizer.step()
                        epoch_loss += loss.item()
                    print(f"[Rank {rank}] Epoch {epoch+1}/3 - avg loss: {epoch_loss/10:.4f}")

                dist.barrier()
                print(f"[Rank {rank}] Training COMPLETE - all ranks synchronized")
                dist.destroy_process_group()
                print(f"[Rank {rank}] Done.")
              resources:
                requests:
                  cpu: "1"
                  memory: "2Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
            restartPolicy: Never
